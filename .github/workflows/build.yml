name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project source (handles nested zips too)
        run: |
          if [ ! -f files.zip ]; then
            echo "ERROR: files.zip not found in repository root"
            ls -la
            exit 1
          fi
          unzip -o files.zip -d extracted
          for i in 1 2 3 4 5; do
            FOUND=$(find extracted -name "*.zip" 2>/dev/null || true)
            if [ -z "$FOUND" ]; then
              break
            fi
            echo "$FOUND" | while read -r z; do
              echo "Unzipping nested archive: $z"
              unzip -o "$z" -d extracted
              rm -f "$z"
            done
          done
          echo "----- Final extracted contents -----"
          find extracted -maxdepth 6

      - name: Locate project folder
        id: locate
        run: |
          # Correct find with parentheses for -o
          SETTINGS_FILE=$(find extracted \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts anywhere inside the zip!"
            find extracted
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the deprecated/removed "tools" package
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            echo "Using project gradlew"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew found – using system gradle"
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saurav-popup-dictionary-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
